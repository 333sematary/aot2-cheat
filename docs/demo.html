<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AOT2 Cheat / Trainer — Launcher Preview</title>
<style>
:root{color-scheme:dark;font:600 14px "Segoe UI",Arial,sans-serif;color:#dedfe2;background:#0a0b0d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0b0d;padding:16px}
.window{width:640px;height:440px;max-width:100%;background:#0a0b0d;position:relative;overflow:hidden;border-radius:18px;color:#dcdddf}
header{height:54px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #2a2c2f;position:relative;font-size:16px;font-weight:700}
.controls{position:absolute;right:15px;top:0;height:53px;display:flex;align-items:center;gap:13px;color:#898b8f;font-size:16px;font-weight:400}
main{position:absolute;top:64px;left:20px;width:600px;height:280px;display:grid;grid-template-columns:294px 294px;gap:12px}
.window.home main{grid-template-columns:600px}.card{border:1px solid #2a2c2f;border-radius:18px;background:#101113;overflow:hidden}
h2{font-size:14px;margin:0;height:39px;padding:11px 15px;border-bottom:1px solid #f5f6f8;font-weight:700}
.rows{padding:4px 14px}.row{height:27px;display:flex;align-items:center;justify-content:space-between;padding:0;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}
.row span:first-child{overflow:hidden;text-overflow:ellipsis;padding-right:5px}.toggle{width:21px;height:21px;border:1px solid #4b4d51;background:#232427;border-radius:8px;flex:none}.toggle.on{background:#f5f6f8;border-color:#f5f6f8;position:relative}.toggle.on:after{content:"✓";color:#1f2124;position:absolute;left:5px;top:0;font-size:14px}
nav{height:58px;position:absolute;bottom:30px;left:50%;transform:translateX(-50%);padding:0 6px;display:flex;gap:8px;background:#111214;border-radius:19px;transition:width .18s ease}nav.collapsed{width:68px}nav.expanded{width:292px;justify-content:space-around}
button{width:48px;height:48px;align-self:flex-start;margin-top:4px;border:0;border-radius:14px;background:transparent;color:#85878b;cursor:pointer;position:relative;display:grid;place-items:center}
button:hover{background:#25272a}button.selected img{opacity:1}button img{width:24px;height:24px;opacity:.58}button.selected:after{content:"";position:absolute;bottom:0;left:21px;width:6px;height:6px;border-radius:50%;background:#f5f6f8}
@media(max-width:670px){.window{transform:scale(calc((100vw - 32px)/640));transform-origin:center}}
</style></head>
<body><section class="window home" id="window">
<header><span id="pageTitle">Main</span><span class="controls"><span>—</span><span>×</span></span></header>
<main><article class="card"><h2 id="leftTitle">Main</h2><div class="rows" id="leftRows"></div></article><article class="card" id="rightCard"><h2 id="rightTitle"></h2><div class="rows" id="rightRows"></div></article></main>
<nav id="nav" class="collapsed" aria-label="Categories"></nav>
</section>
<script>
const categories=[
 {name:'Main',left:'Main',right:'Resources',a:['Personal Script','Max Money','Max City Materials'],b:['Max Wing of Freedom Badges','All Materials','All Gifts']},
 {name:'Player Data',left:'Current Character',right:'Change Values',a:['Player Data'],b:['Titan Timer','Partners Skills No Cooldown','Max Reinforce New Equipment (Buy)','Max Awakening Ability Points (+140)','Showdown Equipment Always Available','Infinite Showdown Equipment (on rescue missions)','Battle Alert Signal Infinite Duration','Spawn Dire Elimination','Auto End/Win Battle']},
 {name:'World',left:'World',right:'Supplies',a:['Infinite Gas','Infinite Blades'],b:['Infinite Ammo','Infinite Combat Items']},
 {name:'Tools',left:'Combat Tools',right:'Automation',a:['Infinite Dash & Multi-Attacks','Auto Hook Drive'],b:['Auto Overall Score SS']},
 {name:'Social',left:'Social',right:'Progress',a:['Quick Friendship Gain'],b:['Quick Camaraderie Points']}
];
const icons=['house.png','user-round.png','globe.png','sliders-horizontal.png','settings.png'];let enabled=false,active=0;
const nav=document.querySelector('#nav'), win=document.querySelector('#window');
function rows(items,checked=[]){return items.map(name=>`<div class="row"><span>${name}</span><span class="toggle ${checked.includes(name)?'on':''}"></span></div>`).join('')}
function render(){const page=categories[active];document.querySelector('#pageTitle').textContent=page.name;
 document.querySelector('#leftTitle').textContent=active===0&&!enabled?'Main':page.left;
 document.querySelector('#rightTitle').textContent=active===0&&!enabled?'':page.right;
 document.querySelector('#rightCard').hidden=active===0&&!enabled;win.classList.toggle('home',active===0&&!enabled);
 document.querySelector('#leftRows').innerHTML=rows(active===0&&!enabled?['Personal Script']:page.a,active===0&&enabled?['Personal Script']:[]);
 document.querySelector('#rightRows').innerHTML=rows(page.b);
 nav.className=enabled?'expanded':'collapsed';nav.innerHTML='';
 (enabled?[0,1,2,3,4]:[0]).forEach(index=>{const button=document.createElement('button');button.type='button';button.title=categories[index].name;button.setAttribute('aria-label',categories[index].name);button.className=index===active?'selected':'';button.innerHTML=`<img src="../assets/icons/${icons[index]}" alt="">`;button.onclick=()=>{active=index;render()};nav.append(button)});
 document.querySelectorAll('.row').forEach(row=>row.addEventListener('click',()=>{if(active===0&&row.firstElementChild.textContent==='Personal Script'){enabled=!enabled;if(!enabled)active=0;render()}}));
}
render();
</script></body></html>
